<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaigns - Temp Testing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .campaign-item {
            cursor: pointer;
        }

        .campaign-item:hover {
            background-color: #f8f9fa;
        }

        .campaign-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .delete-btn {
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Campaigns</h1>
            <div class="d-flex gap-2" style="display: none;" id="headerButtons">
                <a href="aiprompt.html" class="btn btn-outline-primary btn-sm">AI Prompt</a>
                <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
            </div>
        </div>

        <!-- Login Form -->
        <div class="card mb-4" id="loginCard">
            <div class="card-body">
                <h5 class="card-title">Login</h5>
                <form id="loginForm">
                    <div class="mb-3">
                        <input type="email" class="form-control" id="email" placeholder="Email" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
            </div>
        </div>

        <!-- Create Campaign Form -->
        <div class="card mb-4" id="createForm" style="display: none;">
            <div class="card-body">
                <h5 class="card-title">Create New Campaign</h5>
                <form id="campaignForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Campaign Title</label>
                            <input type="text" class="form-control" id="campaignName">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Event</label>
                            <select class="form-select" id="eventId" required></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Language</label>
                            <select class="form-select" id="lang">
                                <option value="en">English</option>
                                <option value="fr">French</option>
                                <option value="es">Spanish</option>
                                <option value="it">Italian</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="status">
                                <option value="active">Active</option>
                                <option value="draft">Draft</option>
                                <option value="paused">Paused</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Send Thank You Message At</label>
                            <input type="datetime-local" class="form-control" id="postEventTriggerAt">
                            <small class="form-text text-muted">Date and time to send thank you messages
                                (optional)</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Followup Delay (hours)</label>
                            <input type="number" class="form-control" id="followupDelay" min="1" value="12">
                            <small class="form-text text-muted">Delay in hours before sending followup messages
                                (default: 12)</small>
                        </div>
                    </div>
                    <!-- Talents selection temporarily removed -->
                    <button type="submit" class="btn btn-primary">Create Campaign</button>
                </form>
            </div>
        </div>

        <!-- Campaigns List -->
        <div id="campaignsList"></div>

        <!-- Blacklist Section -->
        <div class="card mb-4" id="blacklistSection" style="display: none;">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">Blacklisted Talents</h5>
                    <button class="btn btn-sm btn-outline-secondary" id="refreshBlacklistBtn">Refresh</button>
                </div>
                <div id="blacklistList">
                    <div class="text-center text-muted">Loading blacklist...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('token');

        // Check if already logged in and token is still valid
        $(async function () {
            token = localStorage.getItem('token');
            if (!token) {
                $('#loginCard').show();
                $('#createForm').hide();
                return;
            }

            try {
                // Lightweight check to validate token; if it fails, fall back to login
                await $.ajax({
                    url: `${API_BASE}/campaigns/promoter`,
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                $('#loginCard').hide();
                $('#createForm').show();
                $('#headerButtons').show();
                $('#blacklistSection').show();
                loadCampaigns();
                loadEvents();
                loadBlacklist();
            } catch (error) {
                console.error('Stored token invalid, showing login again:', error);
                localStorage.removeItem('token');
                token = null;
                $('#loginCard').show();
                $('#createForm').hide();
                $('#headerButtons').hide();
            }
        });

        // Login
        $('#loginForm').on('submit', async function (e) {
            e.preventDefault();
            const email = $('#email').val();
            try {
                const response = await $.ajax({
                    url: `${API_BASE}/auth/login`,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ email })
                });
                token = response.access_token;
                localStorage.setItem('token', token);
                $('#loginCard').hide();
                $('#createForm').show();
                $('#headerButtons').show();
                $('#blacklistSection').show();
                loadCampaigns();
                loadEvents();
                loadBlacklist();
            } catch (error) {
                alert('Login failed: ' + (error.responseJSON?.message || error.statusText));
            }
        });

        // Load Events
        async function loadEvents() {
            try {
                const response = await $.ajax({
                    url: `${API_BASE}/events`,
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const select = $('#eventId');
                select.empty();
                select.append('<option value="">Select Event</option>');
                response.forEach(event => {
                    select.append(`<option value="${event.id}">${event.name} - ${event.city}</option>`);
                });
            } catch (error) {
                console.error('Error loading events:', error);
            }
        }

        // Load Campaigns
        async function loadCampaigns() {
            try {
                const response = await $.ajax({
                    url: `${API_BASE}/campaigns/promoter`,
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                // Load stats for each campaign
                const campaignsWithStats = await Promise.all(response.map(async (campaign) => {
                    try {
                        const stats = await $.ajax({
                            url: `${API_BASE}/campaigns/${campaign.id}/stats`,
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        return { ...campaign, stats };
                    } catch (error) {
                        console.error(`Error loading stats for campaign ${campaign.id}:`, error);
                        return { ...campaign, stats: null };
                    }
                }));
                displayCampaigns(campaignsWithStats);
            } catch (error) {
                $('#campaignsList').html('<div class="alert alert-danger">Error loading campaigns</div>');
            }
        }

        // Display Campaigns
        function displayCampaigns(campaigns) {
            if (campaigns.length === 0) {
                $('#campaignsList').html('<div class="alert alert-info">No campaigns found</div>');
                return;
            }
            let html = '<div class="list-group">';
            campaigns.forEach(campaign => {
                const stats = campaign.stats;
                let statsHtml = '';
                if (stats) {
                    statsHtml = `
                    <div class="mt-2">
                        <div class="row text-center">
                            <div class="col-3">
                                <small class="text-muted d-block">Contacted</small>
                                <strong>${stats.totalContacted || 0}</strong>
                            </div>
                            <div class="col-3">
                                <small class="text-muted d-block">Sent</small>
                                <strong>${stats.sent || 0}</strong>
                            </div>
                            <div class="col-3">
                                <small class="text-muted d-block">Delivered</small>
                                <strong>${stats.delivered || 0}</strong>
                            </div>
                            <div class="col-3">
                                <small class="text-muted d-block">Replied</small>
                                <strong class="text-success">${stats.replied || 0}</strong>
                            </div>
                        </div>`;
                    if (stats.responseClassification) {
                        statsHtml += `
                        <div class="row text-center mt-2">
                            <div class="col-3">
                                <small class="text-muted d-block">Confirmed</small>
                                <strong class="text-success">${stats.responseClassification.confirmed || 0}</strong>
                            </div>
                            <div class="col-3">
                                <small class="text-muted d-block">Interested</small>
                                <strong class="text-info">${stats.responseClassification.interested || 0}</strong>
                            </div>
                            <div class="col-3">
                                <small class="text-muted d-block">Declined</small>
                                <strong class="text-danger">${stats.responseClassification.declined || 0}</strong>
                            </div>
                            <div class="col-3">
                                <small class="text-muted d-block">Seen/No Reply</small>
                                <strong class="text-warning">${stats.responseClassification.seenNoReply || 0}</strong>
                            </div>
                        </div>`;
                    }
                    statsHtml += '</div>';
                } else {
                    statsHtml = '<div class="mt-2"><small class="text-muted">Stats loading...</small></div>';
                }

                const statusColors = {
                    'active': 'success',
                    'paused': 'warning',
                    'draft': 'secondary',
                    'completed': 'info',
                    'stopped': 'danger'
                };
                const currentStatusColor = statusColors[campaign.status] || 'secondary';

                html += `
                    <div class="list-group-item campaign-item">
                        <div class="campaign-item-header">
                            <div onclick="window.location.href='campaign.html?id=${campaign.id}&eventId=${campaign.eventId}'" style="flex: 1; cursor: pointer;">
                                <h5>${escapeHtml(campaign.name)}</h5>
                                <small class="text-muted">
                                    Status: <span class="badge bg-${currentStatusColor}">${campaign.status}</span> | Lang: ${campaign.lang}
                                </small>
                                ${statsHtml}
                            </div>
                            <div class="d-flex gap-2 align-items-start">
                                <div class="dropdown">
                                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="statusDropdown${campaign.id}" data-bs-toggle="dropdown" aria-expanded="false" onclick="event.stopPropagation();">
                                        Change Status
                                    </button>
                                    <ul class="dropdown-menu" aria-labelledby="statusDropdown${campaign.id}">
                                        <li><a class="dropdown-item ${campaign.status === 'active' ? 'active' : ''}" href="#" data-campaign-id="${campaign.id}" data-status="active" onclick="event.stopPropagation(); changeCampaignStatus(${campaign.id}, 'active'); return false;">Active</a></li>
                                        <li><a class="dropdown-item ${campaign.status === 'paused' ? 'active' : ''}" href="#" data-campaign-id="${campaign.id}" data-status="paused" onclick="event.stopPropagation(); changeCampaignStatus(${campaign.id}, 'paused'); return false;">Paused</a></li>
                                        <li><a class="dropdown-item ${campaign.status === 'draft' ? 'active' : ''}" href="#" data-campaign-id="${campaign.id}" data-status="draft" onclick="event.stopPropagation(); changeCampaignStatus(${campaign.id}, 'draft'); return false;">Draft</a></li>
                                        <li><hr class="dropdown-divider"></li>
                                        <li><a class="dropdown-item ${campaign.status === 'completed' ? 'active' : ''}" href="#" data-campaign-id="${campaign.id}" data-status="completed" onclick="event.stopPropagation(); changeCampaignStatus(${campaign.id}, 'completed'); return false;">Completed</a></li>
                                        <li><a class="dropdown-item ${campaign.status === 'stopped' ? 'active' : ''}" href="#" data-campaign-id="${campaign.id}" data-status="stopped" onclick="event.stopPropagation(); changeCampaignStatus(${campaign.id}, 'stopped'); return false;">Stopped</a></li>
                                    </ul>
                                </div>
                                <button class="btn btn-info btn-sm view-templates-btn" data-campaign-id="${campaign.id}" onclick="event.stopPropagation(); window.location.href='template.html?campaignId=${campaign.id}'">
                                    View Templates
                                </button>
                                <button class="btn btn-danger btn-sm delete-btn" data-campaign-id="${campaign.id}" data-campaign-name="${escapeHtml(campaign.name)}">
                                    Delete
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            $('#campaignsList').html(html);

            // Attach delete handlers
            $('.delete-btn').on('click', function (e) {
                e.stopPropagation();
                const campaignId = $(this).data('campaign-id');
                const campaignName = $(this).data('campaign-name');
                deleteCampaign(campaignId, campaignName);
            });
        }

        // Change campaign status
        async function changeCampaignStatus(campaignId, newStatus) {
            try {
                await $.ajax({
                    url: `${API_BASE}/campaigns/${campaignId}/status`,
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify({ status: newStatus })
                });
                // Reload campaigns to show updated status
                loadCampaigns();
            } catch (error) {
                alert('Error changing campaign status: ' + (error.responseJSON?.message || error.statusText));
            }
        }

        // Delete Campaign
        async function deleteCampaign(campaignId, campaignName) {
            if (!confirm(`Are you sure you want to delete "${campaignName}"?`)) {
                return;
            }
            try {
                await $.ajax({
                    url: `${API_BASE}/campaigns/${campaignId}`,
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                alert('Campaign deleted!');
                loadCampaigns();
            } catch (error) {
                alert('Error deleting campaign: ' + (error.responseJSON?.message || error.statusText));
            }
        }

        // Create Campaign (without initial talent invitations)
        $('#campaignForm').on('submit', async function (e) {
            e.preventDefault();

            const data = {
                name: $('#campaignName').val(),
                eventId: parseInt($('#eventId').val()),
                lang: $('#lang').val(),
                status: $('#status').val()
            };
            try {
                // Create campaign
                const campaign = await $.ajax({
                    url: `${API_BASE}/campaigns`,
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify(data)
                });

                // Update postEventTriggerAt if provided
                const postEventTriggerAt = $('#postEventTriggerAt').val();
                if (postEventTriggerAt) {
                    try {
                        // Convert local datetime to ISO string
                        const dateTime = new Date(postEventTriggerAt);
                        await $.ajax({
                            url: `${API_BASE}/campaigns/${campaign.id}/post-event-time`,
                            method: 'PATCH',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            data: JSON.stringify({
                                postEventTriggerAt: dateTime.toISOString()
                            })
                        });
                    } catch (error) {
                        console.error('Error updating post event time:', error);
                    }
                }

                // Update followup_delay if provided
                const followupDelay = $('#followupDelay').val();
                if (followupDelay) {
                    try {
                        await $.ajax({
                            url: `${API_BASE}/campaigns/${campaign.id}/followup-delay`,
                            method: 'PATCH',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            data: JSON.stringify({
                                followup_delay: parseInt(followupDelay)
                            })
                        });
                    } catch (error) {
                        console.error('Error updating followup delay:', error);
                    }
                }

                //alert('Campaign created!');
                $('#campaignForm')[0].reset();
                loadCampaigns();
            } catch (error) {
                alert('Error creating campaign: ' + (error.responseJSON?.message || error.statusText));
            }
        });

        // Logout
        $('#logoutBtn').on('click', function () {
            localStorage.removeItem('token');
            token = null;
            $('#loginCard').show();
            $('#createForm').hide();
            $('#campaignsList').empty();
            $('#blacklistSection').hide();
            $('#headerButtons').hide();
        });

        // Load blacklist
        async function loadBlacklist() {
            try {
                $('#blacklistList').html('<div class="text-center"><div class="spinner-border spinner-border-sm" role="status"></div> Loading blacklist...</div>');

                const blacklist = await $.ajax({
                    url: `${API_BASE}/temp/blacklist`,
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                displayBlacklist(blacklist);
            } catch (error) {
                $('#blacklistList').html(`<div class="alert alert-danger">Error loading blacklist: ${error.responseJSON?.message || error.statusText}</div>`);
            }
        }

        // Display blacklist
        function displayBlacklist(blacklist) {
            if (blacklist.length === 0) {
                $('#blacklistList').html('<div class="alert alert-info">No blacklisted talents found</div>');
                return;
            }

            let html = '<div class="table-responsive"><table class="table table-sm table-striped">';
            html += '<thead><tr>';
            html += '<th>Talent ID</th><th>Blacklisted At</th><th>Actions</th>';
            html += '</tr></thead><tbody>';

            blacklist.forEach(entry => {
                html += `<tr data-blacklist-id="${entry.id}">`;
                html += `<td><strong>${escapeHtml(entry.talentPoolId)}</strong></td>`;
                html += `<td>${formatDate(entry.createdAt)}</td>`;
                html += `<td>
                    <button class="btn btn-sm btn-danger remove-blacklist-btn" data-blacklist-id="${entry.id}" data-talent-id="${entry.talentId}">Remove</button>
                </td>`;
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            $('#blacklistList').html(html);

            // Attach remove handlers
            $('.remove-blacklist-btn').on('click', function () {
                const button = $(this);
                const blacklistId = button.data('blacklist-id');
                const talentId = button.data('talent-id');
                removeFromBlacklist(blacklistId, talentId);
            });
        }

        // Remove from blacklist
        async function removeFromBlacklist(blacklistId, talentId) {
            if (!confirm(`Are you sure you want to remove ${talentId} from the blacklist?`)) {
                return;
            }

            try {
                await $.ajax({
                    url: `${API_BASE}/talent-blacklist/${blacklistId}`,
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                alert('Talent removed from blacklist!');
                loadBlacklist();
            } catch (error) {
                alert('Error removing from blacklist: ' + (error.responseJSON?.message || error.statusText));
            }
        }

        // Refresh blacklist button
        $('#refreshBlacklistBtn').on('click', function () {
            loadBlacklist();
        });

        function formatDate(date) {
            if (!date) return '';
            return new Date(date).toLocaleString();
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
