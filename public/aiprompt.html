<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompts Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .prompt-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff;
        }
        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        .prompt-key {
            font-weight: bold;
            font-size: 1.2em;
            color: #0d6efd;
        }
        .prompt-field {
            margin-bottom: 15px;
        }
        .prompt-field label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
            display: block;
        }
        .prompt-field .field-value {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 5px;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 50px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #dee2e6;
        }
        .prompt-field textarea {
            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }
        .prompt-field input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }
        .edit-mode .field-value {
            display: none;
        }
        .edit-mode textarea,
        .edit-mode input[type="text"] {
            display: block;
        }
        .view-mode textarea,
        .view-mode input[type="text"] {
            display: none;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
        }
        .badge-role {
            font-size: 0.9em;
            padding: 6px 12px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="index.html" class="btn btn-secondary mb-2">← Back to Campaigns</a>
                <h1 class="mb-0">AI Prompts Management</h1>
            </div>
            <button id="logoutBtn" class="btn btn-outline-secondary btn-sm" style="display: none;">Logout</button>
        </div>

        <div id="promptsContainer">
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api';
        let token = localStorage.getItem('token');

        // Check authentication
        $(async function() {
            if (!token) {
                alert('Please login first');
                window.location.href = 'index.html';
                return;
            }

            try {
                // Validate token
                await $.ajax({
                    url: `${API_BASE}/campaigns/promoter`,
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                $('#logoutBtn').show();
                loadPrompts();
            } catch (error) {
                console.error('Token invalid:', error);
                localStorage.removeItem('token');
                alert('Session expired. Please login again.');
                window.location.href = 'index.html';
            }
        });

        // Load all prompts
        async function loadPrompts() {
            try {
                const prompts = await $.ajax({
                    url: `${API_BASE}/ai-prompts`,
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                displayPrompts(prompts);
            } catch (error) {
                $('#promptsContainer').html(`
                    <div class="alert alert-danger">
                        Error loading prompts: ${error.responseJSON?.message || error.statusText}
                    </div>
                `);
            }
        }

        // Display prompts
        function displayPrompts(prompts) {
            if (prompts.length === 0) {
                $('#promptsContainer').html('<div class="alert alert-info">No prompts found</div>');
                return;
            }

            let html = '';
            prompts.forEach(prompt => {
                html += `
                    <div class="prompt-card view-mode" id="prompt-${prompt.id}">
                        <div class="prompt-header">
                            <div>
                                <span class="prompt-key">${escapeHtml(prompt.key)}</span>
                                <span class="badge badge-role bg-secondary ms-2">${escapeHtml(prompt.role || 'No role')}</span>
                            </div>
                            <div class="btn-group-custom">
                                <button class="btn btn-sm btn-primary edit-btn" data-prompt-id="${prompt.id}">
                                    Edit
                                </button>
                                <button class="btn btn-sm btn-success save-btn" data-prompt-id="${prompt.id}" style="display: none;">
                                    Save
                                </button>
                                <button class="btn btn-sm btn-secondary cancel-btn" data-prompt-id="${prompt.id}" style="display: none;">
                                    Cancel
                                </button>
                            </div>
                        </div>
                        
                        <div class="prompt-field">
                            <label>Role:</label>
                            <div class="field-value">${escapeHtml(prompt.role || 'No role set')}</div>
                            <input type="text" class="form-control edit-role" value="${escapeHtml(prompt.role || '')}" placeholder="Enter role">
                        </div>
                        
                        <div class="prompt-field">
                            <label>Definitions (defs):</label>
                            <div class="field-value">${escapeHtml(prompt.defs || 'No definitions')}</div>
                            <textarea class="form-control edit-defs" rows="6" placeholder="Enter prompt definitions">${escapeHtml(prompt.defs || '')}</textarea>
                        </div>
                    </div>
                `;
            });

            $('#promptsContainer').html(html);

            // Attach event handlers
            $('.edit-btn').on('click', function() {
                const promptId = $(this).data('prompt-id');
                enterEditMode(promptId);
            });

            $('.save-btn').on('click', function() {
                const promptId = $(this).data('prompt-id');
                savePrompt(promptId);
            });

            $('.cancel-btn').on('click', function() {
                const promptId = $(this).data('prompt-id');
                cancelEdit(promptId);
            });
        }

        // Enter edit mode
        function enterEditMode(promptId) {
            const card = $(`#prompt-${promptId}`);
            card.removeClass('view-mode').addClass('edit-mode');
            card.find('.edit-btn').hide();
            card.find('.save-btn, .cancel-btn').show();
        }

        // Cancel edit
        async function cancelEdit(promptId) {
            // Reload prompts to reset any changes
            await loadPrompts();
        }

        // Save prompt
        async function savePrompt(promptId) {
            const card = $(`#prompt-${promptId}`);
            const role = card.find('.edit-role').val().trim();
            const defs = card.find('.edit-defs').val().trim();

            // Validation
            if (!defs) {
                alert('Definitions (defs) cannot be empty');
                return;
            }

            const updateData = {};
            if (role !== undefined) {
                updateData.role = role;
            }
            if (defs !== undefined) {
                updateData.defs = defs;
            }

            try {
                // Show loading state
                card.find('.save-btn').prop('disabled', true).text('Saving...');

                await $.ajax({
                    url: `${API_BASE}/ai-prompts/${promptId}`,
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify(updateData)
                });

                // Reload prompts to show updated data
                await loadPrompts();
                alert('Prompt updated successfully!');
            } catch (error) {
                alert('Error updating prompt: ' + (error.responseJSON?.message || error.statusText));
                card.find('.save-btn').prop('disabled', false).text('Save');
            }
        }

        // Logout
        $('#logoutBtn').on('click', function() {
            localStorage.removeItem('token');
            token = null;
            window.location.href = 'index.html';
        });

        // Utility function to escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
